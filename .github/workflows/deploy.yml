name: Deploy Campaign Chronicles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descarga el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala dependencias
      - name: Install dependencies
        run: npm ci

      # Comprueba que GitHub recibe correctamente
      # las variables necesarias para Supabase.
      - name: Validate Supabase environment variables
        run: |
          node <<'NODE'
          const url = process.env.VITE_SUPABASE_URL || ''
          const key = process.env.VITE_SUPABASE_ANON_KEY || ''

          console.log('---------------------------')
          console.log('URL LENGTH:', url.length)
          console.log('STARTS WITH HTTPS:', url.startsWith('https://'))
          console.log('ENDS WITH SUPABASE.CO:', url.endsWith('.supabase.co'))
          console.log('ANON KEY PRESENT:', key.length > 0 ? 'YES' : 'NO')
          console.log('ANON KEY LENGTH:', key.length)

          try {
            const parsed = new URL(url)
            console.log('URL PARSE:', 'VALID')
            console.log('PROTOCOL:', parsed.protocol)
            console.log('HOSTNAME:', parsed.hostname)
          } catch {
            console.log('URL PARSE:', 'INVALID')
            process.exit(1)
          }

          console.log('---------------------------')
          NODE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Compila Campaign Chronicles.
      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Comprueba qué archivos generó Vite
      # y que la URL de Supabase quedó incluida en el bundle.
      - name: Verify generated build
        run: |
          echo "---------------------------"
          echo "GENERATED ASSETS:"
          ls -lah dist/assets

          echo ""
          echo "INDEX FILE:"
          grep -o 'assets/index-[^"]*\.js' dist/index.html || true

          echo ""
          echo "SUPABASE URL IN BUNDLE:"
          if grep -R -q "tzuuektabsznuwomsggz.supabase.co" dist; then
            echo "YES"
          else
            echo "NO"
            exit 1
          fi

          echo "---------------------------"

      # Configura GitHub Pages.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Sube exactamente el dist recién generado.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publica el nuevo build.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4