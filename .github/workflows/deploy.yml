name: Deploy Campaign Chronicles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Descarga el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala dependencias
      - name: Install dependencies
        run: npm ci

      # Comprueba que las variables de Supabase llegan correctamente
      # sin mostrar la clave completa.
      - name: Debug Supabase environment variables
        run: |
          node <<'NODE'
          const url = process.env.VITE_SUPABASE_URL || ''
          const key = process.env.VITE_SUPABASE_ANON_KEY || ''

          console.log('---------------------------')
          console.log('URL LENGTH:', url.length)
          console.log('STARTS WITH HTTPS:', url.startsWith('https://'))
          console.log('ENDS WITH SUPABASE.CO:', url.endsWith('.supabase.co'))
          console.log('ANON KEY PRESENT:', key.length > 0 ? 'YES' : 'NO')
          console.log('ANON KEY LENGTH:', key.length)

          try {
            const parsed = new URL(url)

            console.log('URL PARSE:', 'VALID')
            console.log('PROTOCOL:', parsed.protocol)
            console.log('HOSTNAME:', parsed.hostname)
            console.log('PATHNAME:', parsed.pathname)
          } catch {
            console.log('URL PARSE:', 'INVALID')
          }

          console.log('---------------------------')
          NODE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Compila la aplicación con las variables de Supabase
      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Configura GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Sube la carpeta dist generada por Vite
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publica el artifact en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4