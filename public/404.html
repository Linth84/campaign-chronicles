<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Campaign Chronicles</title>
    <script>
      const path =
        window.location.pathname +
        window.location.search +
        window.location.hash

      sessionStorage.setItem(
        'spa-redirect',
        path,
      )

      window.location.replace('/')
    </script>
  </head>
  <body></body>
</html>
